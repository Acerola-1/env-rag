[project]
name = "env-rag-final"
version = "0.1.0"
description = "Environmental RAG: LightRAG plus scoped keyword and structure retrieval"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lightrag-hku>=1.5.7,<1.6",
    "openai>=2.0,<3",
    "asyncpg>=0.31,<1",
    "pgvector>=0.4,<1",
    "qdrant-client>=1.19,<2",
    "neo4j>=6.3,<7",
    "httpx>=0.28,<1",
    "python-dotenv>=1.2,<2",
    "lxml>=6,<7",
    "jieba>=0.42.1",
    "rfc8785>=0.1.4,<0.2",
]

[project.scripts]
env-rag-final = "env_rag_final.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/env_rag_final"]

[dependency-groups]
dev = ["ruff>=0.14,<1", "pytest>=8,<10"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
